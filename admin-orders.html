<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MP Frames - Customer Orders</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            min-width: 1200px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #111;
            color: white;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        .order-photo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            margin: auto;
        }

        .photo-buttons {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .photo-buttons a {
            text-decoration: none;
            padding: 7px 10px;
            border-radius: 5px;
            color: white;
            font-size: 13px;
        }

        .view-btn {
            background: #2196f3;
        }

        .download-btn {
            background: #673ab7;
        }

        select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .update-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1ebc57;
        }

        .paid {
            color: green;
            font-weight: bold;
        }

        .not-paid {
            color: red;
            font-weight: bold;
        }

        .no-photo {
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Customer Orders</h1>

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Frame</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Photo</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Update</th>
                    <th>Date</th>
                </tr>

            </thead>

            <tbody id="ordersTable">

                <tr>
                    <td colspan="11" class="loading">
                        Loading Orders...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <script type="module" src="admin-orders.js"></script>

</body>

</html>
