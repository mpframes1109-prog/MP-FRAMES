<!DOCTYPE html>
<html>
<head>
    <title>MP Frames - Orders</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:30px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#000;
            color:white;
        }

        img{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:8px;
        }

        select{
            padding:5px;
        }

        button{
            background:#25D366;
            color:white;
            border:none;
            padding:8px 12px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>Customer Orders</h1>

<table>

<thead>

<tr>

<th>Name</th>

<th>Phone</th>

<th>Address</th>

<th>Frame</th>

<th>Message</th>

<th>Photo</th>

<th>Status</th>

<th>Update</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

<script type="module" src="admin-orders.js"></script>

</body>

</html>
