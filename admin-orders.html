<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>MP Frames - Customer Orders</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        Arial,
        sans-serif;

    background:#f4f6f8;

    color:#222;

}


header{

    background:#111;

    color:white;

    padding:22px;

    text-align:center;

}


header h1{

    margin:0;

    font-size:28px;

}


.container{

    width:95%;

    max-width:1500px;

    margin:30px auto;

}


.orders-card{

    background:white;

    border-radius:14px;

    padding:20px;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);

    overflow-x:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:1100px;

}


th{

    background:#111;

    color:white;

    padding:15px;

    font-size:14px;

}


td{

    padding:14px;

    border-bottom:
        1px solid #eee;

    text-align:center;

    vertical-align:middle;

}


tr:hover{

    background:#fafafa;

}


.order-image{

    width:90px;

    height:90px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #ddd;

}


small{

    color:#777;

}


.status-select{

    padding:9px;

    border-radius:7px;

    border:1px solid #ccc;

    font-weight:bold;

}


button,
.download-btn{

    border:none;

    border-radius:7px;

    padding:9px 12px;

    cursor:pointer;

    text-decoration:none;

    display:inline-block;

    margin:3px;

    font-weight:bold;

}


.view-btn{

    background:#2563eb;

    color:white;

}


.download-btn{

    background:#16a34a;

    color:white;

}


.update-btn{

    background:#111;

    color:white;

}


.view-btn:hover{

    background:#1d4ed8;

}


.download-btn:hover{

    background:#15803d;

}


.update-btn:hover{

    background:#333;

}


.actions{

    min-width:220px;

}


</style>

</head>


<body>


<header>

    <h1>MP Frames — Customer Orders</h1>

</header>


<div class="container">

    <div class="orders-card">

        <table>

            <thead>

                <tr>

                    <th>Customer</th>

                    <th>Phone</th>

                    <th>Address</th>

                    <th>Frame</th>

                    <th>Price</th>

                    <th>Customer Image</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="ordersTable">

            </tbody>

        </table>

    </div>

</div>


<script
    type="module"
    src="admin-orders.js">
</script>


</body>

</html>
