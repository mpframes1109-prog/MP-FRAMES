<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP Frames - Admin Panel</title>
<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#111;
    color:#fff;
    padding:15px;
    text-align:center;
}

.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

.form-box{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    padding:12px 20px;
    background:#111;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:gold;
    color:#000;
}

#product-list{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}
</style>

</head>
<body>

<header>
<h1>MP Frames Admin Panel</h1>
</header>

<div class="container">

<div class="form-box">

<h2>Add New Product</h2>

<input type="text" id="name" placeholder="Product Name">

<input type="number" id="price" placeholder="Product Price">

<input type="text" id="image" placeholder="Image URL (or images/frame1.jpg)">

<button onclick="addProduct()">
Add Product
</button>

</div>

<h2 style="margin-top:40px;">All Products</h2>

<div id="product-list"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
