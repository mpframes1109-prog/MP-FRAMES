<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MP Frames - Admin Panel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header-content h1 {
            margin: 0;
            font-size: 28px;
        }

        .logout-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #c62828;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* DASHBOARD */

        .dashboard {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );

            gap: 20px;
            margin-bottom: 35px;
        }

        .dashboard-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
            text-align: center;
        }

        .dashboard-card h3 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .dashboard-card p {
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }

        .orders-card {
            cursor: pointer;
            transition: .2s;
        }

        .orders-card:hover {
            transform: translateY(-4px);
        }

        .orders-card p {
            color: #2196f3;
        }

        /* FORM */

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .form-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .add-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .add-btn:hover {
            background: #1ebc57;
        }

        /* PRODUCTS */

        .products-title {
            margin-top: 40px;
            margin-bottom: 20px;
        }

        #product-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,.08);
        }

        .product-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            margin: 0 0 8px;
        }

        .product-price {
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #c62828;
        }

        .empty-products {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        @media(max-width:700px) {

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .container {
                width: 94%;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="header-content">

            <h1>
                MP Frames Admin Panel
            </h1>

          <button
    type="button"
    onclick="logoutAdmin()"
    class="logout-btn"
>
    Logout
</button>  

        </div>

    </header>


    <!-- MAIN -->

    <div class="container">


        <!-- DASHBOARD -->

        <div class="dashboard">


            <div
                class="dashboard-card orders-card"
                onclick="window.location.href='admin-orders.html'"
            >

                <h3>
                    Customer Orders
                </h3>

                <p>
                    📦
                </p>

                <span>
                    View Orders →
                </span>

            </div>


            <div class="dashboard-card">

                <h3>
                    Products
                </h3>

                <p id="productCount">
                    0
                </p>

                <span>
                    Total Products
                </span>

            </div>


        </div>


        <!-- ADD PRODUCT -->

        <div class="form-box">

            <h2>
                Add New Product
            </h2>


            <input
                type="text"
                id="name"
                placeholder="Product Name"
            >


            <input
                type="number"
                id="price"
                placeholder="Product Price"
            >


            <input
                type="text"
                id="category"
                placeholder="Category"
            >


            <input
                type="file"
                id="image"
                accept="image/*"
            >


            <button
                class="add-btn"
                onclick="addProduct()"
            >
                Add Product
            </button>

        </div>


        <!-- PRODUCTS -->

       <h2>All Products</h2>

<div id="productsList">
    Loading products...
</div>


    <!-- ADMIN JS -->

    <script type="module" src="admin.js"></script>

</body>

</html>
