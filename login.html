<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | MP Frames</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .admin-title {
            font-size: 36px;
            font-weight: 800;
            color: #111;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #111;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
        }

        #loginBtn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #loginBtn:hover {
            background: #333;
        }

        #errorMessage {
            color: #d00000;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        .back-home {
            display: inline-block;
            margin-top: 22px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #000;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 30px 22px;
            }

            .admin-title {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1 class="admin-title">ADMIN PANEL</h1>

            <p class="subtitle">
                MP Frames Administration
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn">
                    Login
                </button>

                <p id="errorMessage"></p>

            </form>

            <a href="index.html" class="back-home">
                ← Back to MP Frames
            </a>

        </div>

    </div>

    <!-- Keep your existing Firebase login JavaScript -->
    <script type="module" src="login.js"></script>

</body>
</html>
