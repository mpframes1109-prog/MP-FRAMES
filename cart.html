<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - MP Frames</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        /* HEADER */

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .home-btn {
            color: white;
            text-decoration: none;
            background: #333;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .home-btn:hover {
            background: #555;
        }

        /* MAIN */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .page-title {
            margin-bottom: 25px;
            font-size: 30px;
        }

        /* CART LAYOUT */

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
            align-items: start;
        }

        /* CART ITEMS */

        #cart-items {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .cart-item {
            background: white;
            border-radius: 12px;
            padding: 18px;

            display: flex;
            gap: 20px;
            align-items: center;

            box-shadow: 0 4px 15px rgba(0,0,0,.07);
        }

        .cart-image {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee;
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
        }

        .item-details h3 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .category {
            color: #777;
            margin-bottom: 8px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* QUANTITY */

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-box button {
            width: 32px;
            height: 32px;

            border: none;
            border-radius: 5px;

            background: #111;
            color: white;

            font-size: 18px;
            cursor: pointer;
        }

        .quantity-box button:hover {
            background: #333;
        }

        .quantity {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        /* REMOVE */

        .remove-btn {
            margin-top: 12px;

            border: none;
            background: #e53935;
            color: white;

            padding: 8px 14px;
            border-radius: 5px;

            cursor: pointer;
        }

        .remove-btn:hover {
            background: #c62828;
        }

        /* SUMMARY */

        .summary {
            background: white;
            padding: 25px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,.07);

            position: sticky;
            top: 20px;
        }

        .summary h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;

            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;

            font-size: 22px;
            font-weight: bold;

            padding: 20px 0;
        }

        .checkout-btn {
            width: 100%;

            padding: 15px;

            background: #25D366;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #1ebc57;
        }

        .continue-btn {
            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 13px;

            text-align: center;

            background: #111;
            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

        .continue-btn:hover {
            background: #333;
        }

        /* EMPTY CART */

        .empty-cart {
            background: white;

            padding: 60px 20px;

            text-align: center;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,.07);
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;

            padding: 13px 25px;

            background: #111;
            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }

        }

        @media (max-width: 550px) {

            .cart-item {
                align-items: flex-start;
            }

            .cart-image {
                width: 90px;
                height: 90px;
            }

            .item-details h3 {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="header-inner">

            <div class="logo">
                MP Frames
            </div>

            <a
                href="index.html"
                class="home-btn"
            >
                Home
            </a>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">

        <h1 class="page-title">
            Your Cart
        </h1>


        <div id="emptyCart" class="empty-cart">

            <h2>
                Your cart is empty
            </h2>

            <p>
                Add some beautiful frames to your cart.
            </p>

            <a
                href="products.html"
                class="shop-btn"
            >
                Continue Shopping
            </a>

        </div>


        <div
            id="cartLayout"
            class="cart-layout"
            style="display:none;"
        >


            <!-- ITEMS -->

            <div id="cart-items"></div>


            <!-- SUMMARY -->

            <div class="summary">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span id="itemCount">
                        0
                    </span>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹<span id="total">0</span>
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    onclick="proceedToCheckout()"
                >
                    Proceed to Checkout
                </button>


                <a
                    href="products.html"
                    class="continue-btn"
                >
                    Continue Shopping
                </a>

            </div>


        </div>

    </main>


    <script>

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        const cartItems =
            document.getElementById(
                "cart-items"
            );


        const cartLayout =
            document.getElementById(
                "cartLayout"
            );


        const emptyCart =
            document.getElementById(
                "emptyCart"
            );


        const totalElement =
            document.getElementById(
                "total"
            );


        const itemCountElement =
            document.getElementById(
                "itemCount"
            );


        // ==========================
        // LOAD CART
        // ==========================

        function loadCart() {

            cartItems.innerHTML = "";

            let total = 0;

            let itemCount = 0;


            if (cart.length === 0) {

                emptyCart.style.display =
                    "block";

                cartLayout.style.display =
                    "none";

                return;

            }


            emptyCart.style.display =
                "none";

            cartLayout.style.display =
                "grid";


            cart.forEach(
                (item, index) => {

                    if (!item.quantity) {

                        item.quantity = 1;

                    }


                    const price =
                        Number(item.price) || 0;


                    const quantity =
                        Number(item.quantity) || 1;


                    total +=
                        price * quantity;


                    itemCount +=
                        quantity;


                    cartItems.innerHTML += `

                        <div class="cart-item">

                            <img
                                class="cart-image"
                                src="${item.image || ""}"
                                alt="${item.name || "Frame"}"
                            >


                            <div class="item-details">

                                <h3>
                                    ${item.name || "Frame"}
                                </h3>


                                <div class="category">
                                    ${item.category || ""}
                                </div>


                                <div class="price">
                                    ₹${price}
                                </div>


                                <div class="quantity-box">

                                    <button
                                        onclick="changeQty(${index}, -1)"
                                    >
                                        −
                                    </button>


                                    <span class="quantity">
                                        ${quantity}
                                    </span>


                                    <button
                                        onclick="changeQty(${index}, 1)"
                                    >
                                        +
                                    </button>

                                </div>


                                <button
                                    class="remove-btn"
                                    onclick="removeItem(${index})"
                                >
                                    Remove
                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            totalElement.innerText =
                total;


            itemCountElement.innerText =
                itemCount;


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }


        // ==========================
        // CHANGE QUANTITY
        // ==========================

        function changeQty(index, value) {

            if (!cart[index]) {

                return;

            }


            cart[index].quantity =
                (cart[index].quantity || 1)
                + value;


            if (
                cart[index].quantity < 1
            ) {

                cart[index].quantity = 1;

            }


            loadCart();

        }


        // ==========================
        // REMOVE ITEM
        // ==========================

        function removeItem(index) {

            cart.splice(index, 1);

            loadCart();

        }


        // ==========================
        // CHECKOUT
        // ==========================

        function proceedToCheckout() {

            if (cart.length === 0) {

                alert(
                    "Your cart is empty"
                );

                return;

            }


            window.location.href =
                "checkout.html";

        }


        // ==========================
        // START
        // ==========================

        loadCart();

    </script>


</body>

</html>
