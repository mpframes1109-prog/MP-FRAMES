<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - MP Frames</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        /* HEADER */

        header {
            background: #111;
            color: white;
            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .cart-link {
            color: white;
            text-decoration: none;
            font-size: 21px;
        }

        #cart-count {
            background: #25D366;
            color: white;

            min-width: 20px;
            height: 20px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 12px;
            margin-left: 4px;
        }

        /* BACK BUTTON */

        .back {
            display: inline-block;

            margin: 25px;

            color: #111;
            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* PRODUCT */

        .product-container {
            max-width: 1100px;

            margin: 20px auto 50px;

            padding: 30px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 45px;
        }

        /* IMAGE */

        .product-image-section {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image {
            width: 100%;
            max-width: 500px;

            height: 500px;

            object-fit: contain;

            border-radius: 12px;

            background: #f7f7f7;
        }

        /* DETAILS */

        .product-details {
            padding: 15px 5px;
        }

        .product-details h2 {
            font-size: 34px;
            margin: 0 0 15px;
        }

        .category {
            color: #777;
            font-size: 16px;

            margin-bottom: 15px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;

            margin: 15px 0;

            color: #e91e63;
        }

        .description {
            line-height: 1.8;

            color: #555;

            margin-top: 25px;
        }

        .features {
            margin-top: 20px;

            line-height: 2;
        }

        /* BUTTONS */

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        .buttons button {

            flex: 1;

            padding: 15px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        .add-cart {
            background: #111;
            color: white;
        }

        .add-cart:hover {
            background: #333;
        }

        .buy-now {
            background: #25D366;
            color: white;
        }

        .buy-now:hover {
            background: #1ebc57;
        }

        /* LOADING */

        .loading {
            max-width: 1100px;

            margin: 60px auto;

            padding: 50px;

            text-align: center;

            background: white;

            border-radius: 12px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            header {
                padding: 14px 18px;
            }

            header h1 {
                font-size: 20px;
            }

            .product-container {
                grid-template-columns: 1fr;

                margin: 10px 12px 40px;

                padding: 18px;

                gap: 20px;
            }

            .product-image {
                height: 350px;
            }

            .product-details h2 {
                font-size: 27px;
            }

            .price {
                font-size: 27px;
            }

            .buttons {
                flex-direction: column;
            }

            .back {
                margin: 20px 15px;
            }
        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>
        MP Frames
    </h1>

    <a
        href="cart.html"
        class="cart-link"
    >

        <i class="fa-solid fa-cart-shopping"></i>

        <span id="cart-count">
            0
        </span>

    </a>

</header>


<!-- BACK -->

<a
    href="products.html"
    class="back"
>
    ← Back to Products
</a>


<!-- LOADING -->

<div
    id="loading"
    class="loading"
>
    Loading product...
</div>


<!-- PRODUCT -->

<div
    id="productContainer"
    class="product-container"
    style="display:none;"
>


    <!-- IMAGE -->

    <div class="product-image-section">

        <img
            id="productImage"
            class="product-image"
            alt="Product Image"
        >

    </div>


    <!-- DETAILS -->

    <div class="product-details">

        <h2 id="productName">
        </h2>


        <div
            id="productCategory"
            class="category"
        >
        </div>


        <div
            id="productPrice"
            class="price"
        >
        </div>


        <div class="description">

            <strong>
                Premium Quality Photo Frame
            </strong>

            <p>
                Create beautiful memories with
                our premium quality photo frames.
            </p>

        </div>


        <div class="features">

            ✔ High Quality Finish<br>

            ✔ Long Lasting Material<br>

            ✔ Perfect for Home Decoration<br>

            ✔ Best Gift Choice

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button
                class="add-cart"
                onclick="addToCart()"
            >
                🛒 Add To Cart
            </button>


            <button
                class="buy-now"
                onclick="buyNow()"
            >
                ⚡ Buy Now
            </button>

        </div>

    </div>

</div>


<script>

    /* =================================
       GET SELECTED PRODUCT
    ================================= */

    const selectedProduct =
        JSON.parse(
            localStorage.getItem(
                "selectedProduct"
            )
        );


    /* =================================
       CHECK PRODUCT
    ================================= */

    if (!selectedProduct) {

        alert(
            "No Product Selected"
        );

        window.location.href =
            "products.html";

    }


    /* =================================
       SHOW PRODUCT
    ================================= */

    if (selectedProduct) {

        const image =
            document.getElementById(
                "productImage"
            );

        const name =
            document.getElementById(
                "productName"
            );

        const category =
            document.getElementById(
                "productCategory"
            );

        const price =
            document.getElementById(
                "productPrice"
            );

        const container =
            document.getElementById(
                "productContainer"
            );

        const loading =
            document.getElementById(
                "loading"
            );


        /* IMAGE */

        image.src =
            selectedProduct.image || "";


        image.alt =
            selectedProduct.name ||
            "MP Frames";


        image.onerror =
            function () {

                this.src =
                    "https://via.placeholder.com/500x500?text=MP+Frames";

            };


        /* NAME */

        name.innerText =
            selectedProduct.name ||
            "MP Frame";


        /* CATEGORY */

        category.innerText =
            "Category: " +
            (
                selectedProduct.category ||
                "Not Available"
            );


        /* PRICE */

        price.innerText =
            "₹" +
            (
                Number(
                    selectedProduct.price
                ) || 0
            );


        /* SHOW */

        loading.style.display =
            "none";

        container.style.display =
            "grid";

    }


    /* =================================
       CART COUNT
    ================================= */

    function updateCartCount() {

        const cartCount =
            document.getElementById(
                "cart-count"
            );


        const cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];


        let totalQuantity = 0;


        cart.forEach(item => {

            totalQuantity +=
                Number(
                    item.quantity
                ) || 1;

        });


        cartCount.innerText =
            totalQuantity;

    }


    /* =================================
       ADD TO CART
    ================================= */

    function addToCart() {

        if (!selectedProduct) {
            return;
        }


        let cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];


        const existing =
            cart.find(
                item =>
                    item.id ===
                    selectedProduct.id
            );


        if (existing) {

            existing.quantity =
                (
                    Number(
                        existing.quantity
                    ) || 1
                ) + 1;

        } else {

            cart.push({

                id:
                    selectedProduct.id,

                name:
                    selectedProduct.name,

                price:
                    Number(
                        selectedProduct.price
                    ) || 0,

                category:
                    selectedProduct.category ||
                    "",

                image:
                    selectedProduct.image ||
                    "",

                quantity: 1

            });

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        updateCartCount();


        alert(
            "Product Added To Cart!"
        );

    }


    /* =================================
       BUY NOW
    ================================= */

    function buyNow() {

        if (!selectedProduct) {
            return;
        }


        let cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];


        const existing =
            cart.find(
                item =>
                    item.id ===
                    selectedProduct.id
            );


        if (existing) {

            existing.quantity =
                (
                    Number(
                        existing.quantity
                    ) || 1
                ) + 1;

        } else {

            cart.push({

                id:
                    selectedProduct.id,

                name:
                    selectedProduct.name,

                price:
                    Number(
                        selectedProduct.price
                    ) || 0,

                category:
                    selectedProduct.category ||
                    "",

                image:
                    selectedProduct.image ||
                    "",

                quantity: 1

            });

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        window.location.href =
            "checkout.html";

    }


    /* =================================
       START
    ================================= */

    updateCartCount();

</script>


</body>

</html>
