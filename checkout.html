<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Checkout - MP Frames</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

/* HEADER */

header {
    background: #111;
    color: white;
    padding: 18px 25px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 26px;
}


/* CHECKOUT */

.checkout-container {
    width: 92%;
    max-width: 650px;
    margin: 35px auto;
}

.checkout-box {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.checkout-box h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}


/* INPUTS */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #111;
}

.form-group textarea {
    height: 110px;
    resize: vertical;
}


/* PHOTO */

.photo-box {
    border: 2px dashed #ccc;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    background: #fafafa;
}

.photo-box input {
    border: none;
}


/* MESSAGE */

.message-info {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}


/* SUMMARY */

.order-summary {
    margin-top: 25px;
    padding: 20px;
    background: #f7f7f7;
    border-radius: 8px;
}

.order-summary h3 {
    margin-top: 0;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
}

.total-row {
    border-top: 1px solid #ddd;
    margin-top: 10px;
    padding-top: 15px;

    display: flex;
    justify-content: space-between;

    font-size: 21px;
    font-weight: bold;
}


/* BUTTON */

.place-order-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;

    background: #25D366;
    color: white;

    border: none;
    border-radius: 7px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

.place-order-btn:hover {
    background: #1ebc57;
}

.place-order-btn:disabled {
    background: #999;
    cursor: not-allowed;
}


/* BACK */

.back-cart {
    display: block;
    text-align: center;
    margin-top: 15px;

    color: #111;
    text-decoration: none;
}

.back-cart:hover {
    text-decoration: underline;
}


/* MOBILE */

@media (max-width: 600px) {

    .checkout-container {
        width: 95%;
    }

    .checkout-box {
        padding: 20px;
    }

    header h1 {
        font-size: 22px;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        MP Frames Checkout
    </h1>

</header>


<div class="checkout-container">


    <div class="checkout-box">


        <h2>
            Customer Details
        </h2>


        <!-- NAME -->

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
            >

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
            >

        </div>


        <!-- ADDRESS -->

        <div class="form-group">

            <label for="address">
                Delivery Address
            </label>

            <textarea
                id="address"
                placeholder="Enter complete delivery address"
                autocomplete="street-address"
            ></textarea>

        </div>


        <!-- PHOTO -->

        <div class="form-group">

            <label for="photo">
                Upload Your Frame Photo
            </label>

            <div class="photo-box">

                <input
                    type="file"
                    id="photo"
                    accept="image/*"
                >

                <p class="message-info">
                    JPG, JPEG, PNG — Maximum 5 MB
                </p>

            </div>

        </div>


        <!-- MESSAGE -->

        <div class="form-group">

            <label for="message">
                Message / Custom Instructions
            </label>

            <textarea
                id="message"
                placeholder="Any special instructions for your frame?"
            ></textarea>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="order-summary">

            <h3>
                Order Summary
            </h3>


            <div class="summary-row">

                <span>
                    Items
                </span>

                <span id="itemCount">
                    0
                </span>

            </div>


            <div class="total-row">

                <span>
                    Total
                </span>

                <span>
                    ₹<span id="total">0</span>
                </span>

            </div>

        </div>


        <!-- PLACE ORDER -->

        <button
            type="button"
            class="place-order-btn"
            onclick="placeOrder()"
        >

            Place Order

        </button>


        <a
            href="cart.html"
            class="back-cart"
        >

            ← Back to Cart

        </a>


    </div>

</div>


<!-- CHECKOUT JAVASCRIPT -->

<script
    type="module"
    src="checkout.js"
></script>


</body>

</html>
